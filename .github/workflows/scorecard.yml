# Daily scorecard refresh. Every run ends in a pull request, whatever check_scorecard.py says (CLEAN, REVIEW, HOLD or
# FAILED); nothing is pushed to main. Merge the PR to publish (Cloudflare rebuilds on the push to main).
name: Scorecard refresh

on:
  schedule:
    - cron: "30 10 * * *"   # 5:30 am Toronto (EST); off the top of the hour, when GitHub delays or drops scheduled runs
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Give up retrying rate-limited fetches after this many minutes"
        default: "150"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked environment
        run: uv sync --locked --managed-python --python 3.14.3

      - name: Refresh results and check
        env:
          MAX_MINUTES: ${{ inputs.max_minutes || '150' }}
        run: bash .github/scripts/scorecard_run.sh

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-log-${{ github.run_id }}
          path: ci_out/
          retention-days: 14

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(cat ci_out/status)
          day=$(TZ=America/Toronto date +%F)
          branch="scorecard/$day-run${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A data/scorecard data/raw site
          if git diff --cached --quiet; then
            echo "Nothing changed; no PR." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -q -m "Scorecard run $day ($status, Actions run ${{ github.run_number }})"
          git push -q origin "$branch"
          {
            echo "Automated scorecard refresh, **$status**. Merge to publish; close to discard."
            echo
            cat ci_out/summary.md
            echo
            echo '```'
            # the check output; "newly settled" lines last, the whole thing cut to fit a PR body
            grep -v "^info    newly settled" ci_out/check.txt
            grep "^info    newly settled" ci_out/check.txt
            echo '```'
          } | head -c 60000 > ci_out/pr_body.md
          echo >> ci_out/pr_body.md
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> ci_out/pr_body.md
          gh pr create --base main --head "$branch" --title "Scorecard $day: $status" --body-file ci_out/pr_body.md
